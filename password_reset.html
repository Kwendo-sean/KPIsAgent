<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | KPIConsole</title>
    <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
    <link href="/static/vendor/fontawesome/css/all.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: "Inter", system-ui, sans-serif;
            background: #F2F2F2;
            color: #111;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .card {
            width: min(440px, 100%);
            background: #fff;
            border: 1px solid #E3E3E3;
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 12px 32px rgba(0,0,0,.08);
        }
        .brand {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg,#4F46E5,#6366F1);
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: .85rem; font-weight: 800;
        }
        .brand-name { font-size: 1.1rem; font-weight: 700; letter-spacing: -.02em; }
        .brand-name span { color: #4F46E5; }
        h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; }
        p  { margin: 0 0 24px; color: #6B6B6B; font-size: .92rem; line-height: 1.6; }
        label { display: block; font-size: .78rem; font-weight: 700; letter-spacing: .10em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 8px; }
        input[type="email"] {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #E3E3E3; border-radius: 10px;
            font: inherit; font-size: .94rem; color: #111;
            background: #F8F8F8; outline: none;
            transition: border-color 150ms ease;
            margin-bottom: 20px;
        }
        input[type="email"]:focus { border-color: #4F46E5; background: #fff; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 13px;
            background: linear-gradient(135deg,#0D0D0D,#2A2A2A);
            color: #fff; border: 0; border-radius: 99px;
            font: inherit; font-size: .92rem; font-weight: 600;
            cursor: pointer; transition: all 200ms ease;
        }
        .btn:hover { background: linear-gradient(135deg,#4F46E5,#6366F1); transform: translateY(-1px); }
        .back { display: block; text-align: center; margin-top: 20px; font-size: .87rem; color: #4F46E5; font-weight: 600; text-decoration: none; }
        .back:hover { opacity: .75; }
        @media (prefers-color-scheme: dark) {
            body { background: #0A0A0A; color: #ECECEC; }
            .card { background: #141414; border-color: #2A2A2A; }
            input[type="email"] { background: #1C1C1C; border-color: #2A2A2A; color: #ECECEC; }
            input[type="email"]:focus { background: #222; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <div class="brand-icon">KPI</div>
            <div class="brand-name">KPI<span>Console</span></div>
        </div>
        <h1>Reset your password</h1>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        <form method="post">
            {% csrf_token %}
            <label for="id_email">Email address</label>
            {{ form.email }}
            <button class="btn" type="submit"><i class="fas fa-paper-plane"></i> Send reset link</button>
        </form>
        <a href="{% url 'login' %}" class="back"><i class="fas fa-arrow-left"></i> Back to sign in</a>
    </div>
</body>
</html>
