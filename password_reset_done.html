<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | KPIConsole</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: "Inter", system-ui, sans-serif;
            background: #F2F2F2; color: #111;
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            width: min(440px, 100%); background: #fff;
            border: 1px solid #E3E3E3; border-radius: 20px;
            padding: 40px 36px; box-shadow: 0 12px 32px rgba(0,0,0,.08);
            text-align: center;
        }
        .icon {
            width: 64px; height: 64px; border-radius: 18px;
            background: rgba(22,163,74,.10); border: 1px solid rgba(22,163,74,.2);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 1.6rem; color: #16A34A;
        }
        h1 { margin: 0 0 10px; font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; }
        p  { margin: 0 0 28px; color: #6B6B6B; font-size: .92rem; line-height: 1.65; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px; background: linear-gradient(135deg,#0D0D0D,#2A2A2A);
            color: #fff; border: 0; border-radius: 99px;
            font: inherit; font-size: .92rem; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 200ms ease;
        }
        .btn:hover { background: linear-gradient(135deg,#4F46E5,#6366F1); transform: translateY(-1px); }
        @media (prefers-color-scheme: dark) {
            body { background: #0A0A0A; color: #ECECEC; }
            .card { background: #141414; border-color: #2A2A2A; }
            p { color: #777; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-envelope-circle-check"></i></div>
        <h1>Check your inbox</h1>
        <p>If an account exists for that email address, we've sent a password reset link. Check your spam folder if you don't see it within a few minutes.</p>
        <a href="{% url 'login' %}" class="btn"><i class="fas fa-arrow-left"></i> Back to sign in</a>
    </div>
</body>
</html>
