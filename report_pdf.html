<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Financial Report</title>
    <style>
        @page {
            size: a4 portrait;
            margin: 2cm;
            @frame header_frame {
                -pdf-frame-content: header_content;
                left: 50pt; width: 512pt; top: 30pt; height: 40pt;
            }
            @frame footer_frame {
                -pdf-frame-content: footer_content;
                left: 50pt; width: 512pt; top: 790pt; height: 20pt;
            }
        }
        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 11pt;
            color: #333333;
            line-height: 1.5;
        }
        h1 {
            color: #1A4D3E;
            font-size: 24pt;
            border-bottom: 2px solid #2C7A5C;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }
        h2 {
            color: #2C7A5C;
            font-size: 16pt;
            margin-top: 24px;
            margin-bottom: 12px;
        }
        h3 {
            color: #333333;
            font-size: 13pt;
            margin-top: 16px;
            margin-bottom: 8px;
        }
        p {
            margin-bottom: 12px;
            text-align: justify;
        }
        ul, ol {
            margin-bottom: 12px;
            margin-left: 20px;
        }
        li {
            margin-bottom: 6px;
        }
        strong {
            color: #1A4D3E;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
            margin-top: 8px;
        }
        th {
            background-color: #2C7A5C;
            color: #ffffff;
            font-weight: bold;
            padding: 8px;
            text-align: left;
            border: 1px solid #1A4D3E;
        }
        td {
            padding: 8px;
            border: 1px solid #dddddd;
        }
        .cover-page {
            text-align: center;
            margin-top: 150px;
        }
        .cover-title {
            font-size: 32pt;
            font-weight: bold;
            color: #1A4D3E;
            margin-bottom: 20px;
        }
        .cover-subtitle {
            font-size: 16pt;
            color: #6C7A72;
            margin-bottom: 50px;
        }
        .cover-date {
            font-size: 12pt;
            font-style: italic;
            color: #333333;
        }
        .page-break {
            pdf-pagebreak-before: always;
        }
    </style>
</head>
<body>
    <div id="header_content" style="text-align: right; font-style: italic; color: #888888; font-size: 9pt;">
        KPIConsole AI Financial Report
    </div>
    <div id="footer_content" style="text-align: center; font-size: 9pt; color: #888888;">
        Page <pdf:pagenumber> of <pdf:pagecount>
    </div>

    <!-- Cover Page -->
    <div class="cover-page">
        <div class="cover-title">Comprehensive Financial Report</div>
        <div class="cover-subtitle">Generated by KPIConsole AI Copilot</div>
        <div class="cover-date">Report Date: {{ current_date }}<br>Timeframe: {{ timeframe_label }}</div>
    </div>
    
    <div class="page-break"></div>

    <!-- Main Content rendered from Gemini Markdown -->
    <div>
        {{ report_html|safe }}
    </div>

</body>
</html>
